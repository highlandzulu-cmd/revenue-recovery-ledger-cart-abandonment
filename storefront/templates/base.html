<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aura Store{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header">
        <a href="/" class="logo">✨ Aura Store</a>
        <div class="header-right">
            {% if customer %}
            <span class="user-chip">👤 {{ customer.name }}</span>
            {% endif %}
            <nav><a href="/cart">Cart{% if cart_count %} ({{ cart_count }}){% endif %}</a></nav>
        </div>
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
