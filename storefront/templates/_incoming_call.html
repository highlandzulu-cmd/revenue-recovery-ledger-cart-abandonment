<div id="incoming-call-overlay" class="phone-overlay" hidden>
    <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-status-bar">
            <span id="ios-clock">9:41</span>
            <span class="phone-status-icons">
                <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="currentColor"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="currentColor"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="currentColor"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor"/></svg>
                <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.2a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4zM4.6 6.5a4.8 4.8 0 016.8 0l-1.4 1.5a2.8 2.8 0 00-4 0L4.6 6.5zM2 3.8a8.6 8.6 0 0112 0L12.6 5.3a6.6 6.6 0 00-9.2 0L2 3.8z" fill="currentColor"/></svg>
                <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="currentColor"/><rect x="22.5" y="4" width="1.8" height="4" rx="0.8" fill="currentColor"/></svg>
            </span>
        </div>
        <div class="phone-screen">
            <div id="ios-call-avatar" class="phone-avatar ringing">A</div>
            <div id="ios-call-name" class="phone-name">Aura Store</div>
            <div id="ios-call-sub" class="phone-sub">mobile</div>
            <div id="ios-call-timer" class="phone-timer" hidden>00:00</div>
            <div class="phone-controls">
                <div class="phone-btn-group">
                    <button id="ios-call-decline" class="phone-btn decline" title="Decline">✕</button>
                    <span class="phone-btn-label">Decline</span>
                </div>
                <div class="phone-btn-group">
                    <button id="ios-call-accept" class="phone-btn accept" title="Accept">📞</button>
                    <span class="phone-btn-label">Accept</span>
                </div>
                <div class="phone-btn-group" id="ios-call-end-group" hidden>
                    <button id="ios-call-end" class="phone-btn end" title="End call">📞</button>
                    <span class="phone-btn-label">End</span>
                </div>
            </div>
        </div>

        <div id="phone-message-screen" class="phone-message-screen" hidden>
            <div class="message-header">
                <div class="phone-avatar">A</div>
                <div class="message-title">Aura Store</div>
            </div>
            <div class="message-bubble-row">
                <div class="message-bubble">
                    <span id="call-message-text"></span>
                    <a id="call-message-link" class="message-link" href="#" target="_blank" rel="noopener"></a>
                </div>
            </div>
            <button id="message-done-btn" class="message-done-btn" type="button">Done</button>
        </div>
    </div>
    <audio id="ios-call-audio" src="/static/audio/agent-call.wav" preload="none"></audio>
</div>
